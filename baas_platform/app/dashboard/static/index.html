<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>baas_platform · Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230b0c0d'/><path d='M30 25v50h40' stroke='%23a6f12b' stroke-width='14' fill='none'/></svg>">
  <link rel="stylesheet" href="/dashboard/static/styles.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="card login-card" autocomplete="on">
      <div class="logo big">L</div>
      <h1>baas_platform Studio</h1>
      <p class="muted">Inicia sesión como administrador de la plataforma.</p>
      <label>Email<input id="login-email" type="email" required autocomplete="username" value="admin@example.com"></label>
      <label>Contraseña<input id="login-pass" type="password" required autocomplete="current-password"></label>
      <p id="login-error" class="error" role="alert"></p>
      <button class="btn primary" type="submit">Entrar</button>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <nav class="rail" aria-label="Secciones">
      <div class="logo">L</div>
      <button class="rail-btn active" data-view="overview" title="Resumen" aria-label="Resumen">▦</button>
      <button class="rail-btn" data-view="tables" title="Tablas" aria-label="Tablas">☷</button>
      <button class="rail-btn" data-view="sql" title="SQL" aria-label="SQL">⌘</button>
      <button class="rail-btn" data-view="project" title="Proyecto y claves" aria-label="Proyecto y claves">⚿</button>
      <span class="grow"></span>
      <button class="rail-btn" id="logout" title="Cerrar sesión" aria-label="Cerrar sesión">⏻</button>
    </nav>

    <main>
      <header class="topbar">
        <div>
          <h1 id="view-title">Resumen</h1>
          <p class="muted" id="view-sub">Rendimiento, comportamiento e información operativa</p>
        </div>
        <div class="top-actions">
          <select id="project-select" aria-label="Proyecto"></select>
          <button class="btn" id="new-project">+ Proyecto</button>
          <select id="range-select" aria-label="Rango">
            <option value="7d">Últimos 7 días</option>
            <option value="30d" selected>Últimos 30 días</option>
            <option value="12m">Últimos 12 meses</option>
          </select>
          <div class="avatar" id="avatar">AD</div>
        </div>
      </header>
      <div id="empty" class="card empty" hidden>
        <h2>Aún no tienes proyectos</h2>
        <p class="muted">Crea tu primer proyecto para obtener sus claves y empezar a usar la API.</p>
        <button class="btn primary" id="empty-create">Crear proyecto</button>
      </div>
      <section id="content"></section>
    </main>
  </div>

  <dialog id="dlg-project">
    <form method="dialog" id="project-form" class="card">
      <h2>Nuevo proyecto</h2>
      <label>Nombre<input id="project-name" required minlength="2" maxlength="80" placeholder="Mi aplicación"></label>
      <p id="project-error" class="error"></p>
      <div class="row end"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn primary" id="project-ok" value="ok">Crear</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/dashboard/static/app.js"></script>
</body>
</html>
